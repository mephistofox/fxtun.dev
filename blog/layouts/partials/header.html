{{- $main := .Site.Params.mainSiteURL -}}
<header class="site">
  <a class="logo" href="{{ $main }}/" aria-label="fxTunnel — на главную"><i aria-hidden="true">⚡</i>fxtun</a>
  <nav aria-label="Разделы сайта">
    <a href="{{ $main }}/features">Возможности</a>
    <a href="{{ $main }}/pricing">Тарифы</a>
    <a href="{{ $main }}/downloads">Скачать</a>
    <a href="{{ $main }}/docs">Документация</a>
    <a class="on" href="/blog/" aria-current="page">Блог</a>
  </nav>
  <button type="button" class="theme" onclick="window.cycleTheme()" aria-label="Сменить тему">
    <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    <svg id="theme-icon-monitor" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="display:none"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
  </button>
  <a class="cta" href="{{ $main }}/register">Запустить туннель бесплатно</a>
  <details class="burger">
    <summary>☰</summary>
    <nav aria-label="Меню">
      <a href="{{ $main }}/features">Возможности</a><a href="{{ $main }}/pricing">Тарифы</a>
      <a href="{{ $main }}/downloads">Скачать</a><a href="{{ $main }}/docs">Документация</a>
      <a href="/blog/">Блог</a><a href="{{ $main }}/register">Запустить туннель бесплатно</a>
    </nav>
  </details>
</header>
